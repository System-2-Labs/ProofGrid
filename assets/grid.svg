<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Minor Lattice (32px) -->
    <pattern id="grid-minor" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 V 32 M 0 32 H 32" fill="none" stroke="#F1F5F9" stroke-width="1.5"/>
    </pattern>
    
    <!-- Background Major Lattice (128px) -->
    <pattern id="grid-major" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M 128 0 V 128 M 0 128 H 128" fill="none" stroke="#E2E8F0" stroke-width="2.5"/>
    </pattern>

    <!-- Derivation Flow Gradients -->
    <linearGradient id="grad-A-S1" x1="96" y1="128" x2="256" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="grad-B-S1" x1="96" y1="256" x2="256" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="grad-B-S2" x1="96" y1="256" x2="256" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="grad-C-S2" x1="96" y1="384" x2="256" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="grad-S1-T" x1="256" y1="192" x2="416" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-S2-T" x1="256" y1="320" x2="416" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Clean Canvas -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  
  <!-- The Grid Substrate -->
  <rect width="512" height="512" fill="url(#grid-minor)"/>
  <rect width="512" height="512" fill="url(#grid-major)"/>

  <!-- Proof Edges (Deduction paths drawn underneath nodes) -->
  <g fill="none" stroke-width="10" stroke-linecap="round">
    <!-- Axioms to Intermediate Lemmas -->
    <line x1="96" y1="128" x2="256" y2="192" stroke="url(#grad-A-S1)"/>
    <line x1="96" y1="256" x2="256" y2="192" stroke="url(#grad-B-S1)"/>
    <line x1="96" y1="256" x2="256" y2="320" stroke="url(#grad-B-S2)"/>
    <line x1="96" y1="384" x2="256" y2="320" stroke="url(#grad-C-S2)"/>
    
    <!-- Lemmas to Final Theorem/Proof -->
    <line x1="256" y1="192" x2="416" y2="256" stroke="url(#grad-S1-T)"/>
    <line x1="256" y1="320" x2="416" y2="256" stroke="url(#grad-S2-T)"/>
  </g>

  <!-- Logical Nodes (Grid-aligned blocks) -->
  <g rx="8">
    <!-- Level 0: The Premises/Axioms -->
    <rect x="64" y="96" width="64" height="64" fill="#E63946" rx="12"/>
    <rect x="64" y="224" width="64" height="64" fill="#D97706" rx="12"/>
    <rect x="64" y="352" width="64" height="64" fill="#6D28D9" rx="12"/>

    <!-- Level 1: Synthesized Lemmas -->
    <rect x="224" y="160" width="64" height="64" fill="#0284C7" rx="12"/>
    <rect x="224" y="288" width="64" height="64" fill="#4338CA" rx="12"/>

    <!-- Level 2: The Verified Proof -->
    <rect x="384" y="224" width="64" height="64" fill="#059669" rx="12"/>
  </g>

  <!-- Formal Logic Identifiers (Universal symbols of reasoning) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- For All (∀) -->
    <path d="M 84 116 L 96 140 L 108 116 M 90 128 H 102"/>
    
    <!-- Exists (∃) - CORRECTED to inverted 'E' -->
    <path d="M 84 244 H 108 V 268 H 84 M 108 256 H 88"/>
    
    <!-- Not (¬) -->
    <path d="M 84 376 H 108 V 392"/>
    
    <!-- Logical AND (∧) -->
    <path d="M 244 204 L 256 180 L 268 204"/>
    
    <!-- Implies (→) -->
    <path d="M 240 320 H 272 M 258 308 L 272 320 L 258 332"/>
    
    <!-- Turnstile / Provable (⊢) -->
    <path d="M 404 244 V 268 M 404 256 H 428"/>

  </g>
</svg>